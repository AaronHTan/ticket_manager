[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/retrieval",
    "crates/storage",
    "crates/api",
    "crates/client",
    "crates/connectors/jira",
    "apps/server",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# --- Internal crates -------------------------------------------------------
ticket-core = { path = "crates/core" }
ticket-engine = { path = "crates/engine" }
ticket-retrieval = { path = "crates/retrieval" }
ticket-storage = { path = "crates/storage" }
ticket-api = { path = "crates/api" }
ticket-client = { path = "crates/client" }
ticket-jira = { path = "crates/connectors/jira" }
ticket-server = { path = "apps/server" }

# --- External crates -------------------------------------------------------
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
